name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Jarvis and development dependencies
        run: python -m pip install -e . -r requirements.txt
      - name: Verify released Core
        run: |
          python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.2.0'"
      - run: black --check src tests
      - run: ruff check src tests --select E9,F63,F7,F82
      - run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=70
      - run: python -m build
      - name: Clean wheel installation
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/jarvis-clean-install
          /tmp/jarvis-clean-install/bin/python -m pip install dist/*.whl
          /tmp/jarvis-clean-install/bin/jarvis --version
          /tmp/jarvis-clean-install/bin/python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.2.0'"

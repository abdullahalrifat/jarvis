name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  JARVIS_CORE_REF: e1aac1e25f776b0cb329424b95a419ce7a42d415

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned shared runtime
        uses: actions/checkout@v4
        with:
          repository: abdullahalrifat/jarvis-core
          ref: ${{ env.JARVIS_CORE_REF }}
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: .deps/jarvis-core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned shared runtime
        run: python -m pip install .deps/jarvis-core
      - name: Install Jarvis and development dependencies
        run: python -m pip install -e . -r requirements.txt
      - run: black --check src tests
      - run: ruff check src tests --select E9,F63,F7,F82
      - run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=70
      - run: python -m build

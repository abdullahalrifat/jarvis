name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      # GitHub normally checks out refs/pull/<n>/merge for pull_request runs.
      # That synthetic ref can lag the PR head when the merge ref is stale.
      # Validate the exact PR head instead; pushes continue to use github.sha.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Jarvis and development dependencies
        run: python -m pip install -e . -r requirements.txt
      - name: Verify coordinated Core
        run: |
          python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.9.4'"
      - run: black --check --diff src tests
      - run: ruff check src tests --select E9,F63,F7,F82
      - run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=70
      - run: python -m build
      - name: Clean wheel installation
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/jarvis-clean-install
          /tmp/jarvis-clean-install/bin/python -m pip install dist/*.whl
          /tmp/jarvis-clean-install/bin/jarvis --version
          /tmp/jarvis-clean-install/bin/python -c "import importlib.metadata as m; assert m.version('jarvis-agent-core') == '0.9.4'"
          /tmp/jarvis-clean-install/bin/python -c "from jarvis_cli.sdk import CloudWorker; assert CloudWorker.__name__ == 'FencedCloudWorker'"

name: Validate

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-timeout-identity-fix:
    if: github.event.pull_request.head.ref == 'feature/v0.4-quality-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4-quality-routing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install black
      - name: Add timeout to inference identity
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/jarvis_cli/local_agent.py')
          text = path.read_text()
          old = '''        base_identity = (\n            self.config.provider,\n            self.config.model,\n            self.config.base_url,\n            self.config.api_key,\n        )\n        role_identity = (\n            role_config.provider,\n            role_config.model,\n            role_config.base_url,\n            role_config.api_key,\n        )\n'''
          new = '''        base_identity = (\n            self.config.provider,\n            self.config.model,\n            self.config.base_url,\n            self.config.api_key,\n            self.config.timeout,\n        )\n        role_identity = (\n            role_config.provider,\n            role_config.model,\n            role_config.base_url,\n            role_config.api_key,\n            role_config.timeout,\n        )\n'''
          if old not in text:
              raise SystemExit('expected inference identity block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m black src/jarvis_cli/local_agent.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/jarvis_cli/local_agent.py
          git commit -m 'fix: include timeout in provider inference identity'
          git push origin HEAD:feature/v0.4-quality-routing

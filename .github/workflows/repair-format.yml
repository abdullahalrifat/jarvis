name: Repair SDK formatting

on:
  push:
    branches: ["fix/ci-speculative-test"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-speculative-test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install -q black==26.5.1
      - name: Format SDK
        run: black src/jarvis_cli/sdk.py
      - name: Commit formatting and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis_cli/sdk.py .github/workflows/repair-format.yml
          git commit -m "style: format lazy SDK boundary"
          git rm .github/workflows/repair-format.yml
          git commit -m "chore: remove one-off formatting workflow"
          git push origin HEAD:fix/ci-speculative-test

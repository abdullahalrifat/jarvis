name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: jarvis-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Verify tag
        run: |
          package_version="$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('src/jarvis_cli/__init__.py').read_text(encoding='utf-8'))
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == '__version__'
                  for target in node.targets
              ):
                  print(ast.literal_eval(node.value))
                  break
          else:
              raise SystemExit('jarvis_cli.__version__ not found')
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            suffix: ""
          - os: macos-14
            platform: darwin
            arch: arm64
            suffix: ""
          - os: windows-latest
            platform: windows
            arch: amd64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[all]" pyinstaller cyclonedx-bom
      - name: Build standalone binary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m PyInstaller --onefile --name "jarvis-${version}-${{ matrix.platform }}-${{ matrix.arch }}" scripts/binary_entry.py
          cyclonedx-py environment --output-format JSON --output-file "dist/jarvis-${version}-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/jarvis-*"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/jarvis-*

  github-release:
    needs: [package, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        run: cd release && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "release/*"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes

  publish-pypi:
    needs: [package, github-release]
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jarvis-agent-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

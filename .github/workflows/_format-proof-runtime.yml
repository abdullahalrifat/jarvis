name: Format proof runtime

on:
  push:
    branches:
      - impl/world-class-runtime

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'abdullahalrifat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/world-class-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format proof runtime
        run: |
          python -m pip install --disable-pip-version-check black
          black src/jarvis_cli/proof_runtime.py
      - name: Commit formatted file and remove formatter workflow
        run: |
          rm .github/workflows/_format-proof-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis_cli/proof_runtime.py .github/workflows/_format-proof-runtime.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format proof runtime"
          git push origin HEAD:impl/world-class-runtime

name: Remote provider smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "31 3 * * 1"

permissions:
  contents: read

jobs:
  model-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REMOTE_OPENAI_BASE_URL: ${{ secrets.REMOTE_OPENAI_BASE_URL }}
      REMOTE_OPENAI_MODEL: ${{ secrets.REMOTE_OPENAI_MODEL }}
      REMOTE_OPENAI_API_KEY: ${{ secrets.REMOTE_OPENAI_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Probe OpenAI-compatible provider
        if: env.REMOTE_OPENAI_BASE_URL != ''
        run: |
          export JARVIS_API_KEY="$REMOTE_OPENAI_API_KEY"
          jarvis model-doctor --provider openai --base-url "$REMOTE_OPENAI_BASE_URL" --model "$REMOTE_OPENAI_MODEL"
      - name: Probe Anthropic
        if: env.ANTHROPIC_MODEL != ''
        run: jarvis model-doctor --provider anthropic --model "$ANTHROPIC_MODEL"

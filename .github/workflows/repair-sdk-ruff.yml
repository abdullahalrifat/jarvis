name: Repair SDK ruff

on:
  push:
    branches: ["fix/ci-speculative-test"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-speculative-test
      - name: Remove lazy aliases from static export list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/jarvis_cli/sdk.py")
          s = p.read_text()
          old = '''__all__ = [
              "SDKResult",
              "LocalJarvis",
              "LegacyRemoteJarvis",
              "LegacyCloudWorker",
              "RemoteJarvis",
              "CloudWorker",
              "AutonomousRemoteJarvis",
              "FencedCloudWorker",
          ]'''
          new = '''__all__ = [
              "SDKResult",
              "LocalJarvis",
              "LegacyRemoteJarvis",
              "LegacyCloudWorker",
          ]'''
          if old not in s:
              raise SystemExit("SDK __all__ anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis_cli/sdk.py .github/workflows/repair-sdk-ruff.yml
          git commit -m "fix: satisfy ruff for lazy SDK exports"
          git rm .github/workflows/repair-sdk-ruff.yml
          git commit -m "chore: remove one-off SDK ruff workflow"
          git push origin HEAD:fix/ci-speculative-test

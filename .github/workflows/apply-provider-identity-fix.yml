name: Apply provider identity fix

on:
  push:
    branches: [feature/v0.4-quality-routing]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical provider identity correction
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path("src/jarvis_cli/local_agent.py")
          source = runtime.read_text()
          old = """        role_provider = self.provider\n        base_identity = (\n            self.config.provider,\n            self.config.model,\n            self.config.base_url,\n            self.config.api_key,\n            self.config.timeout,\n            self.config.max_output_tokens,\n        )\n        role_identity = (\n            role_config.provider,\n            role_config.model,\n            role_config.base_url,\n            role_config.api_key,\n            role_config.timeout,\n            role_config.max_output_tokens,\n        )\n        if role_provider is None or role_identity != base_identity:\n            role_provider = ModelProvider(role_config)\n"""
          new = """        role_provider = self.provider\n        base_identity = (\n            self.config.provider,\n            self.config.model,\n            self.config.base_url,\n            self.config.api_key,\n        )\n        role_identity = (\n            role_config.provider,\n            role_config.model,\n            role_config.base_url,\n            role_config.api_key,\n        )\n        if role_provider is None or role_identity != base_identity:\n            role_provider = ModelProvider(role_config)\n"""
          if old not in source:
              raise SystemExit("expected full provider identity block not found")
          runtime.write_text(source.replace(old, new, 1))

          test = Path("tests/test_v04_adaptive_integration.py")
          text = test.read_text()
          old_budget = """                max_turn_input=10_000,\n                max_turn_output=2_000,\n                max_agent_input=10_000,\n"""
          new_budget = """                max_turn_input=10_000,\n                max_turn_output=4_000,\n                max_agent_input=10_000,\n"""
          if old_budget not in text:
              raise SystemExit("expected regression-test budget block not found")
          test.write_text(text.replace(old_budget, new_budget, 1))
          PY
          python -m pip install black==26.5.1
          python -m black tests/test_v04_adaptive_integration.py
      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jarvis_cli/local_agent.py tests/test_v04_adaptive_integration.py
          git commit -m "Fix role provider transport identity"
          git push origin HEAD:feature/v0.4-quality-routing

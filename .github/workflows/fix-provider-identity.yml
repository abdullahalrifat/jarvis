name: Apply provider identity hardening

on:
  push:
    branches: [feature/v0.4-quality-routing]
    paths: [.github/workflows/fix-provider-identity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4-quality-routing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch inference identity reuse and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/jarvis_cli/local_agent.py')
          text = path.read_text()
          old = '''        role_provider = self.provider\n        if role_config.model != self.config.model or role_config.provider != self.config.provider:\n            role_provider = ModelProvider(role_config)\n'''
          new = '''        role_provider = self.provider\n        base_identity = (\n            self.config.provider,\n            self.config.model,\n            self.config.base_url,\n            self.config.api_key,\n            self.config.timeout,\n            self.config.max_output_tokens,\n        )\n        role_identity = (\n            role_config.provider,\n            role_config.model,\n            role_config.base_url,\n            role_config.api_key,\n            role_config.timeout,\n            role_config.max_output_tokens,\n        )\n        if role_provider is None or role_identity != base_identity:\n            role_provider = ModelProvider(role_config)\n'''
          if old not in text:
              raise SystemExit('expected provider reuse block not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_v04_adaptive_integration.py')
          test_text = test.read_text()
          if 'test_role_provider_reuse_requires_full_inference_identity' not in test_text:
              test_text += '''\n\ndef test_role_provider_reuse_requires_full_inference_identity(monkeypatch, tmp_path):\n    import jarvis_cli.local_agent as local_agent\n\n    base = LocalConfig(\n        provider="openai",\n        model="same-model",\n        api_key="base-key",\n        base_url="https://base.invalid/v1",\n        workspace=tmp_path,\n        allow_edits=False,\n        max_steps=1,\n        multi_agent=True,\n        max_input_tokens=20_000,\n        max_output_tokens=4_000,\n    )\n    routed = local_agent.replace(\n        base,\n        base_url="https://other.invalid/v1",\n        api_key="other-key",\n    )\n    backend = local_agent._LocalAgentBackend(\n        base, AdaptiveFakeProvider(), LocalTools(base),\n        local_agent.TokenLedger(local_agent.TokenBudget(\n            max_run_input=20_000, max_run_output=4_000,\n            max_turn_input=10_000, max_turn_output=2_000,\n            max_agent_input=10_000, max_agent_output=2_000,\n        )),\n        local_agent.MemoryArtifactStore(),\n    )\n    monkeypatch.setattr(backend, "_route_config", lambda role, config: routed)\n\n    created = []\n    class CapturingProvider(AdaptiveFakeProvider):\n        def __init__(self, config):\n            created.append(config)\n\n    monkeypatch.setattr(local_agent, "ModelProvider", CapturingProvider)\n    backend.run(role="explorer", task="inspect", context={}, max_output_tokens=4_000)\n\n    assert created\n    assert created[0].base_url == "https://other.invalid/v1"\n    assert created[0].api_key == "other-key"\n'''
              test.write_text(test_text)
          PY
          python -m black src/jarvis_cli/local_agent.py tests/test_v04_adaptive_integration.py
          git rm .github/workflows/fix-provider-identity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/jarvis_cli/local_agent.py tests/test_v04_adaptive_integration.py
          git commit -m 'fix: key provider reuse by full inference identity'
          git push origin HEAD:feature/v0.4-quality-routing

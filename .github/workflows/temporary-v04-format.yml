name: Temporary v0.4 formatter

on:
  push:
    branches: [feature/v0.4-quality-routing]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4-quality-routing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install black==26.5.1
      - run: black src tests
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add -- src tests
            git commit -m "Format v0.4 quality implementation"
            git push origin HEAD:feature/v0.4-quality-routing
          fi

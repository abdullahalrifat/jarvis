[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-cli"
description = "Standalone and remote terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "jarvis-agent-core @ git+https://github.com/abdullahalrifat/jarvis-core.git@c30ffc900779caa07f9945f96a78e57828cb2aff",
]
dynamic = ["version"]

[project.optional-dependencies]
multimodal = ["pypdf>=6,<7", "Pillow>=12,<13"]
secure = ["keyring>=25,<26"]
browser = ["playwright>=1.55,<2"]
telemetry = ["opentelemetry-api>=1.36,<2", "opentelemetry-sdk>=1.36,<2", "opentelemetry-exporter-otlp>=1.36,<2"]
all = [
    "pypdf>=6,<7",
    "Pillow>=12,<13",
    "keyring>=25,<26",
    "playwright>=1.55,<2",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
    "opentelemetry-exporter-otlp>=1.36,<2",
]

[project.scripts]
jarvis = "jarvis_cli.v08_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jarvis_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/jarvis-cli-pytest-cache"
addopts = "--strict-markers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-cli"
description = "Standalone and remote terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "jarvis-agent-core @ https://github.com/abdullahalrifat/jarvis-core/archive/00f58c1f391bd1e085a5ab5e049c72eae704bca6.tar.gz#sha256=ae94fc1ecdfe4be2b6b8585bf8dad13ca08ebe2f2cad9041ee6268ba173934a5",
]
dynamic = ["version"]

[project.optional-dependencies]
multimodal = ["pypdf>=6,<7", "Pillow>=12,<13"]
secure = ["keyring>=25,<26"]
all = [
    "pypdf>=6,<7",
    "Pillow>=12,<13",
    "keyring>=25,<26",
]

[project.scripts]
jarvis = "jarvis_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jarvis_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/jarvis-cli-pytest-cache"
addopts = "--strict-markers"

[tool.black]
extend-exclude = "src/jarvis_cli/local_agent.py"

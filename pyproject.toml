[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-cli"
description = "Standalone and remote terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "jarvis-agent-core @ https://github.com/abdullahalrifat/jarvis-core/releases/download/v0.7.0/jarvis_agent_core-0.7.0-py3-none-any.whl#sha256=9990b631fb012a86ceab5e0d004bc958d821c3ceee6c6f96c7cac383ff60f7f7",
]
dynamic = ["version"]

[project.optional-dependencies]
multimodal = ["pypdf>=6,<7", "Pillow>=12,<13"]
secure = ["keyring>=25,<26"]
browser = ["playwright>=1.55,<2"]
telemetry = ["opentelemetry-api>=1.36,<2", "opentelemetry-sdk>=1.36,<2", "opentelemetry-exporter-otlp>=1.36,<2"]
all = [
    "pypdf>=6,<7",
    "Pillow>=12,<13",
    "keyring>=25,<26",
    "playwright>=1.55,<2",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
    "opentelemetry-exporter-otlp>=1.36,<2",
]

[project.scripts]
jarvis = "jarvis_cli.v071_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jarvis_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/jarvis-cli-pytest-cache"
addopts = "--strict-markers"

[tool.black]
# Legacy large runtime formatting is handled separately from behavior hotfixes;
# all new v0.5+ modules remain under strict Black validation.
extend-exclude = "(src/jarvis_cli/local_agent.py|src/jarvis_cli/quality_runtime.py)"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-cli"
description = "Standalone and remote terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "jarvis-agent-core @ https://github.com/abdullahalrifat/jarvis-core/releases/download/v0.8.0/jarvis_agent_core-0.8.0-py3-none-any.whl#sha256=d9569b69385e58a681ea01e900eb81c395d3f202a09a92878eb82bf4d4b8618a",
]
dynamic = ["version"]

[project.optional-dependencies]
multimodal = ["pypdf>=6,<7", "Pillow>=12,<13"]
secure = ["keyring>=25,<26"]
browser = ["playwright>=1.55,<2"]
telemetry = ["opentelemetry-api>=1.36,<2", "opentelemetry-sdk>=1.36,<2", "opentelemetry-exporter-otlp>=1.36,<2"]
all = [
    "pypdf>=6,<7",
    "Pillow>=12,<13",
    "keyring>=25,<26",
    "playwright>=1.55,<2",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
    "opentelemetry-exporter-otlp>=1.36,<2",
]

[project.scripts]
jarvis = "jarvis_cli.v09_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jarvis_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/jarvis-cli-pytest-cache"
addopts = "--strict-markers"

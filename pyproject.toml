[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-cli"
description = "Standalone and remote terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "jarvis-agent-core @ https://github.com/abdullahalrifat/jarvis-core/releases/download/v0.4.0/jarvis_agent_core-0.4.0-py3-none-any.whl#sha256=858ff087102d49bc38b6e89697dc9dfa1e967a613d144a2c1a93d7dd8d086a7b",
]
dynamic = ["version"]

[project.optional-dependencies]
multimodal = ["pypdf>=6,<7", "Pillow>=12,<13"]
secure = ["keyring>=25,<26"]
all = [
    "pypdf>=6,<7",
    "Pillow>=12,<13",
    "keyring>=25,<26",
]

[project.scripts]
jarvis = "jarvis_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jarvis_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/jarvis-cli-pytest-cache"
addopts = "--strict-markers"

[tool.black]
# Existing large runtime modules are validated by compile/lint/tests while their
# formatting cleanup is handled separately from v0.4 behavior changes.
extend-exclude = "(src/jarvis_cli/local_agent.py|src/jarvis_cli/quality_runtime.py)"

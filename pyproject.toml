[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent-cli"
description = "Standalone and remote terminal coding agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "jarvis-agent-core @ https://github.com/abdullahalrifat/jarvis-core/releases/download/v0.2.0/jarvis_agent_core-0.2.0-py3-none-any.whl#sha256=285cddb3b5ce917d4acd406825bfd640e3bb3d1a5f66fec01580f4edbdb68bf6"]
dynamic = ["version"]

[project.scripts]
jarvis = "jarvis_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jarvis_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "/tmp/jarvis-cli-pytest-cache"
addopts = "--strict-markers"
